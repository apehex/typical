[tool.poetry]
name = "typical"
version = "0.1.1"
description = "Harden your project with practical tests & debugging as you code :straight_ruler:"
license = ".github/LICENSE.md"
readme = ".github/README.md"
authors = ["apehex"]
packages = [{include="typical"}]
keywords = ["python-types", "typing", "type-annotations", "type-hints", "machine-learning", "data-validation"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
decorator = ">=5.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
